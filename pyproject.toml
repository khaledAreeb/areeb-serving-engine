[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "engine-bench"
version = "0.1.0"
description = "Reproducible LLM serving-engine benchmark: deploy the same model on several engines, replay realistic traffic, and recommend an engine from measured evidence."
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Khaled Mohamed" }]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "ruamel.yaml>=0.18",
    "structlog>=24.1",
]

[project.scripts]
engine-bench = "engine_bench.cli:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/engine_bench"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (keeps syntax at the py311 floor)
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
